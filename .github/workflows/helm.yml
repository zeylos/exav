# Lint and (on version tags) publish the Helm chart.
#
# `lint` runs on every push/PR: it runs `ct lint`, then checks that the chart
# refuses to render with no signature source, and that each `ci/*-values.yaml`
# renders with the expected hardening settings and none of the dangerous env
# vars. `publish` runs only on `v*` tags: it checks the tag against the
# workspace version in Cargo.toml, then pushes the chart to ghcr.io as an OCI
# artifact. Install with:
#   helm install exav oci://ghcr.io/sylvinus/exav-chart --version <X.Y.Z> \
#     --set 'signatures.sources={https://mirror.example/db/}'
name: helm

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ct needs history to diff the target branch
      - uses: azure/setup-helm@v5
      - uses: helm/chart-testing-action@v2.8.0
      - name: ct lint
        run: ct lint --all --config .github/ct.yaml
      - name: Verify hardening defaults and forbidden env vars
        run: |
          set -euo pipefail
          chart=deploy/helm/exav-chart

          # The chart must refuse to render with no signature source. `helm lint`
          # reports a template `fail` as INFO only, so the check uses `helm template`.
          if helm template exav "$chart" > /dev/null 2>&1; then
            echo "helm template succeeded with no signature source; it must fail by default" >&2
            exit 1
          fi

          # The render must also refuse a forbidden extraEnv var on top of an
          # otherwise-valid values file.
          guard=$(helm template exav "$chart" -f "$chart/ci/allow-no-db-values.yaml" \
            --set 'extraEnv[0].name=EXAV_ALLOW_SHUTDOWN' --set 'extraEnv[0].value=1' 2>&1 || true)
          if ! grep -q 'extraEnv must not set' <<< "$guard"; then
            echo "helm template must fail with the extraEnv guard when EXAV_ALLOW_SHUTDOWN is set" >&2
            exit 1
          fi

          for f in "$chart"/ci/*-values.yaml; do
            echo "::group::$f"
            helm lint --strict "$chart" -f "$f"
            rendered=$(helm template exav "$chart" -f "$f")

            for want in 'readOnlyRootFilesystem: true' 'runAsUser: 65532' \
              'automountServiceAccountToken: false' 'seccompProfile'; do
              if ! grep -q -- "$want" <<< "$rendered"; then
                echo "rendered manifest is missing expected setting: $want" >&2
                exit 1
              fi
            done

            for forbid in EXAV_ALLOW_SHUTDOWN EXAV_ALLOW_HTTP_SCAN; do
              if grep -q -- "$forbid" <<< "$rendered"; then
                echo "rendered manifest must not set: $forbid" >&2
                exit 1
              fi
            done
            echo "::endgroup::"
          done
      - name: Verify the packaged chart excludes ci/ values
        run: |
          set -euo pipefail
          helm package deploy/helm/exav-chart --version 0.0.0-ci --app-version 0.0.0-ci -d dist
          if tar tzf dist/exav-chart-0.0.0-ci.tgz | grep -q '/ci/'; then
            echo "the packaged chart must not contain ci/ values files" >&2
            exit 1
          fi

  publish:
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
      - name: Verify the tag matches the workspace version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p}' Cargo.toml | head -n1)
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "tag version ($tag_version) does not match Cargo.toml workspace version ($cargo_version)" >&2
            exit 1
          fi
          echo "CHART_VERSION=$tag_version" >> "$GITHUB_ENV"
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GH_ACTOR" --password-stdin
      - name: Package and push the chart
        run: |
          set -euo pipefail
          v="$CHART_VERSION"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          helm package deploy/helm/exav-chart --version "$v" --app-version "$v" -d dist
          helm push "dist/exav-chart-$v.tgz" "oci://ghcr.io/$owner"
